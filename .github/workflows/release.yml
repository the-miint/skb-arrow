name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tag matches project version
        run: |
          version="v$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
      # A prerelease goes to TestPyPI, a release to PyPI: the checkbox must say which.
      - name: Prerelease checkbox matches the version
        env:
          CHECKED: ${{ github.event.release.prerelease }}
        run: |
          code='import sys; from packaging.version import Version as V; print(str(V(sys.argv[1]).is_prerelease).lower())'
          is=$(uv run --locked --only-group release python -c "$code" "$(uv version --short)")
          if [ "$is" != "$CHECKED" ]; then
            echo "::error::prerelease checkbox is $CHECKED, but the version's prerelease is $is"
            exit 1
          fi

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  # A prerelease to TestPyPI, a release to PyPI: each index trusts its own environment.
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.release.prerelease && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ github.event.release.prerelease && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
