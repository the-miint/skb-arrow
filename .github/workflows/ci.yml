name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Only PRs share a group, so only PRs cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: .githooks/pre-commit
      - run: uv build
      - run: uv tool install dist/*.whl
      - name: Installed wheel matches source
        run: |
          installed=$("$(uv tool dir --bin)/skb-arrow" --version)
          expected=$(uv run --locked skb-arrow --version)
          if [ "$installed" != "$expected" ]; then
            printf 'installed:\n%s\nsource:\n%s\n' "$installed" "$expected"
            echo "::error::installed wheel --version differs from source"
            exit 1
          fi
      # Release publishes exactly this artifact.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
