[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skb-arrow"
version = "0.1.0"
description = "Process host exposing scikit-bio to non-Python callers over Arrow"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.14"
authors = [{ name = "Daniel McDonald", email = "damcdonald@ucsd.edu" }]
dependencies = [
    "numba==0.68.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "patsy==1.0.3",
    "pyarrow==25.0.1",
    "scikit-bio==0.7.4",
    "scipy==1.18.1",
]

[project.scripts]
skb-arrow = "skb_arrow.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "mypy==2.3.1"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Exception names mirror protocol error kinds (docs/errors.md).
"src/skb_arrow/errors.py" = ["N818"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["pandas.*", "patsy.*", "pyarrow.*", "skbio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
