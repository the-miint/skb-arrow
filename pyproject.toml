[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "skb-arrow"
version = "0.1.0"
description = "Process host exposing scikit-bio to non-Python callers over Arrow"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = "==3.14.*"
authors = [{ name = "Daniel McDonald", email = "damcdonald@ucsd.edu" }]
# Every runtime dependency, exactly (docs/capabilities.md#versioning).
dependencies = [
    "array-api-compat==1.15.0",
    "biom-format==2.1.18",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "decorator==5.3.1",
    "formulaic==1.2.2",
    "h5py==3.16.0",
    "idna==3.20",
    "interface-meta==2.0.1",
    "llvmlite==0.50.0",
    "narwhals==2.26.0",
    "numba==0.68.0",
    "numpy==2.5.3",
    "packaging==26.3",
    "pandas==3.0.6",
    "patsy==1.0.3",
    "pyarrow==25.0.1",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "scikit-bio==0.7.4",
    "scipy==1.18.1",
    "six==1.17.0",
    "statsmodels==0.15.0",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "wrapt==2.5.0",
]

[project.scripts]
skb-arrow = "skb_arrow.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "mypy==2.3.1"]

[tool.uv]
# Supported platforms only (DESIGN §3.9).
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Exception names mirror protocol error kinds (docs/errors.md).
"src/skb_arrow/errors.py" = ["N818"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["pandas.*", "patsy.*", "pyarrow.*", "skbio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not large'"
markers = ["large: multi-GiB payloads, run by the large workflow (pytest -m large)"]
